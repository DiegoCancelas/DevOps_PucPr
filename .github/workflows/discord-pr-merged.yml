name: Notificar Discord - PR mergeada

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    # "closed" também dispara para PRs fechadas sem merge, então filtramos
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alerta ao Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg title "✅ PR #${PR_NUMBER} mergeada: ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg repo "$REPO" \
            --arg author "$PR_AUTHOR" \
            --arg merger "$MERGED_BY" \
            --arg branches "${HEAD_BRANCH} → ${BASE_BRANCH}" \
            '{
              username: "GitHub",
              embeds: [{
                title: $title,
                url: $url,
                color: 5763719,
                fields: [
                  { name: "Repositório", value: $repo, inline: false },
                  { name: "Autor", value: $author, inline: true },
                  { name: "Mergeada por", value: $merger, inline: true },
                  { name: "Branches", value: $branches, inline: false }
                ]
              }]
            }')

          curl -sS -f -H "Content-Type: application/json" \
            -d "$payload" "$DISCORD_WEBHOOK_URL"
